ref: datadog.tag_update_host
label: "Replace Datadog Host Tags"
description: "Replace API v1 host tags in one non-retried request; repeated identical calls are idempotent"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: datadog_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "datadog.credentials", required: true}
  host_name: {type: string, required: true}
  tags: {type: array, required: true, minItems: 1, items: {type: string}}
  source: {type: string}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [datadog, host, tag, write]

ref: datadog.event_post
label: "Post Datadog Event"
description: "Post one Event Management API v2 event to the trusted site intake host; sent exactly once"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: datadog_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "datadog.credentials", required: true}
  body: {type: object, required: true, description: "Current Event Management API v2 JSON:API request object"}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [datadog, event, write]

ref: datadog.host_mute
label: "Mute Datadog Host"
description: "Mute notifications for one API v1 host in one non-retried request"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: datadog_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "datadog.credentials", required: true}
  host_name: {type: string, required: true}
  message: {type: string}
  end: {type: integer, minimum: 1, description: "Optional Unix mute end timestamp"}
  override: {type: boolean, default: false}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [datadog, host, mute, write]

ref: datadog.monitor_get
label: "Get Datadog Monitor"
description: "Get one monitor through API v1"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: datadog_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "datadog.credentials", required: true}
  monitor_id: {type: integer, required: true, minimum: 1, description: "Datadog monitor ID"}
  group_states: {type: string, description: "Comma-separated monitor group states"}
  with_downtimes: {type: boolean}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [datadog, monitor, read]

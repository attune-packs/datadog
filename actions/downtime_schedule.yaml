ref: datadog.downtime_schedule
label: "Schedule Datadog Downtime"
description: "Schedule current API v2 downtime from a JSON:API request object; sent exactly once"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: datadog_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "datadog.credentials", required: true}
  body: {type: object, required: true, description: "API v2 downtime request with data.type and data.attributes"}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [datadog, downtime, write]

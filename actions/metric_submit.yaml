ref: datadog.metric_submit
label: "Submit Datadog Metrics"
description: "Submit metric series to API v2 once; Datadog accepts duplicates, so callers own deduplication"
enabled: true
runner_type: python
runtime_version: ">=3.10"
entry_point: datadog_action.py
parameter_delivery: stdin
parameter_format: json
output_format: json
default_execution_permission_set_refs: [standard]
parameters:
  credential_key: {type: string, default: "datadog.credentials", required: true}
  series: {type: array, required: true, minItems: 1, items: {type: object}, description: "Current API v2 metric series objects"}
output:
  operation: {type: string, required: true}
  result: {type: object, required: true}
tags: [datadog, metric, write]

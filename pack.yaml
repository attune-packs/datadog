ref: datadog
label: "Datadog"
description: "Current Datadog monitor, downtime, event, metric, host, tag, and service-check operations"
version: "0.1.0"
author: "Attune; adapted from work by Lisa Bekdache and StackStorm Exchange contributors"
email: "support@attune.systems"
system: false
enabled: true

conf_schema: {}
config: {}

meta:
  category: monitoring
  documentation_url: "https://docs.datadoghq.com/api/latest/"
  repository_url: "https://github.com/attune-packs/datadog"
  source_repository: "https://github.com/StackStorm-Exchange/stackstorm-datadog"
  source_version: "1.0.2"
  source_revision: "8ade8fd35cdd30f124206425abfa8738438bd3bc"
  source_revision_date: "2024-09-30T21:44:34Z"
  api_review_date: "2026-08-14"
  license: "Apache-2.0"

tags: [datadog, monitoring, metrics, events, integration]
runtime_deps: [python]
dependencies: []

testing:
  enabled: true
  discovery:
    method: directory
    path: tests
  runners:
    python:
      type: unittest
      entry_point: tests/test_pack.py
      timeout: 120
      result_format: simple
  min_pass_rate: 1.0
  on_failure: block
